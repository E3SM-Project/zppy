# Copy this file outside the repository and edit it for the run.
# CLI options override values here; config values override automation defaults.
[cfg_suite]
# Required machine profile and SLURM account for the image checker.
machine = chrysalis
account = e3sm

# Optional identity and paths. An empty tag creates a local-time timestamp;
# a supplied tag resumes that existing run. label is appended to new timestamps.
username =
tag =
label =
shared_root =
scratch_root =
repo_root = ~/ez
# Comma-separated repo=value entries.
repo_path =

# Repository selection and environment controls.
branch =
env_type =
existing_env =
allow_existing_envs = false
solver = mamba
parallel_envs = 1
conda_profile = ~/miniforge3/etc/profile.d/conda.sh

# Comma-separated selections; empty uses the framework defaults.
cfg =
task =
nco_path =

# Temporary dependency isolation, not frozen-environment testing.
# A pin applies to every mutable environment; repo:spec targets one repository.
pin_dependencies =

# Optional E3SM-Unified activation override and comparison baseline run directory.
unified_load_script =
baseline =

# Stage selection and wait limits.
start_stage = prepare
stop_after =
poll_seconds = 600
max_wait_submit = 14400
max_wait_bundles = 3600
max_wait_images = 7200

# Execution options.
skip_unit_tests = false
keep_worktrees = false
verbose = false
