# Configuration rendered by tests/test_rendered_scripts.py with
# `last_year = 1986` (as if zppy were run with `--last-year 1986`).
#
# Every task asks for 1985-1988 in two-year sets, so only the 1985-1986 jobs
# should be generated.
#
# The test replaces `output` with a temporary directory and then writes that
# directory as /zppy_snapshot in the snapshots.

[default]
case = "v3.LR.historical_0051"
dry_run = True
input = "/zppy_snapshot/input/v3.LR.historical_0051"
input_subdir = archive/lnd/hist
mapping_file = "map_r05_to_cmip6_180x360_aave.20231110.nc"
output = "/zppy_snapshot/output"
www = "/zppy_snapshot/www"
years = "1985:1988:2",

[climo]
active = True
walltime = "00:30:00"

  [[ land_monthly_climo_native ]]
  input_files = "elm.h0"
  mapping_file = ""
  vars = ""

[ts]
active = True
walltime = "00:30:00"

  [[ land_monthly ]]
  frequency = "monthly"
  input_files = "elm.h0"
  vars = "FSH,TSA"

[e3sm_to_cmip]
active = True
ts_num_years = 2
walltime = "00:30:00"

  [[ land_monthly ]]
  input_files = "elm.h0"
  ts_subsection = "land_monthly"

[ilamb]
active = True
e3sm_to_cmip_land_subsection = "land_monthly"
land_only = True
short_name = "v3.LR.historical_0051"
ts_land_subsection = "land_monthly"
ts_num_years = 2
walltime = "2:00:00"

[livvkit]
active = True
climo_subsections = "land_monthly_climo_native",
sets = "energy_era5"
ts_land_subsection = "land_monthly"
walltime = "1:30:00"
