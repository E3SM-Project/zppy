# Configuration rendered by tests/test_rendered_scripts.py.
#
# This exercises as many branches of the task templates as practical. It is
# loosely based on tests/integration/template_weekly_comprehensive_v3.cfg, with
# shorter year ranges so that the number of generated scripts stays small, while
# still producing at least two year sets for most tasks.
#
# The test replaces `output` with a temporary directory and then writes that
# directory as /zppy_snapshot in the snapshots, so paths below that start with
# /zppy_snapshot/output refer to this run's own output.

[default]
case = "v3.LR.historical_0051"
dry_run = True
input = "/zppy_snapshot/input/v3.LR.historical_0051"
input_subdir = archive/atm/hist
mapping_file = "map_ne30pg2_to_cmip6_180x360_aave.20200201.nc"
output = "/zppy_snapshot/output"
www = "/zppy_snapshot/www"
years = "1985:1988:2",

[climo]
active = True
# Section-level value: subsections that do not set climo_jobs should inherit it.
climo_jobs = 4
frequency = "monthly"
walltime = "00:30:00"

  [[ atm_monthly_180x360_aave ]]
  input_files = "eam.h0"
  input_subdir = "archive/atm/hist"
  vars = ""

  [[ atm_monthly_diurnal_8xdaily_180x360_aave ]]
  frequency = "diurnal_8xdaily"
  input_files = "eam.h3"
  input_subdir = "archive/atm/hist"
  vars = "PRECT"

  [[ atm_monthly_eamxx_180x360_aave ]]
  case = "1ma_ne30pg2"
  input_component = "eamxx"
  input_files = "AVERAGE.nmonths_x1"
  input_subdir = "run/"

  [[ land_monthly_climo ]]
  input_files = "elm.h0"
  input_subdir = "archive/lnd/hist"
  mapping_file = "map_r05_to_cmip6_180x360_aave.20231110.nc"
  vars = ""

  [[ land_monthly_climo_native ]]
  climo_jobs = 12
  input_files = "elm.h0"
  input_subdir = "archive/lnd/hist"
  mapping_file = ""
  vars = ""

  [[ land_monthly_climo_era5 ]]
  climo_jobs = 12
  grid = "era5"
  input_files = "elm.h0"
  input_subdir = "archive/lnd/hist"
  mapping_file = "map_r05_to_era5_s2n_721x1440.traave.20240124.nc"
  vars = ""

[ts]
active = True
walltime = "00:30:00"

  [[ atm_monthly_180x360_aave ]]
  frequency = "monthly"
  input_files = "eam.h0"
  input_subdir = "archive/atm/hist"
  vars = "FSNTOA,FLUT,FSNT,FLNT,FSNS,FLNS,SHFLX,QFLX,TAUX,TAUY,PRECC,PRECL,PRECSC,PRECSL,TS,TREFHT,CLDTOT,CLDHGH,CLDMED,CLDLOW,U,PSL,LANDFRAC,T,PS,V,Z3"

  [[ atm_monthly_eamxx_180x360_aave ]]
  case = "1ma_ne30pg2"
  extra_vars = "ps,hyai,hyam,hybi,hybm,area,landfrac,ocnfrac"
  frequency = "monthly"
  input_component = "eamxx"
  input_files = "AVERAGE.nmonths_x1"
  input_subdir = "run/"
  vars = "ps,T_2m,SeaLevelPressure,U,V,T_mid"
  vrt_remap_vars = "U,V,T_mid"

  [[ atm_daily_180x360_aave ]]
  frequency = "daily"
  input_files = "eam.h1"
  input_subdir = "archive/atm/hist"
  vars = "PRECT"

  [[ rof_monthly ]]
  extra_vars = 'areatotal2'
  frequency = "monthly"
  input_files = "mosart.h0"
  input_subdir = "archive/rof/hist"
  mapping_file = ""
  vars = "RIVER_DISCHARGE_OVER_LAND_LIQ"

  [[ atm_monthly_glb ]]
  bundle = "bundle_glb"
  frequency = "monthly"
  input_files = "eam.h0"
  input_subdir = "archive/atm/hist"
  mapping_file = "glb"

  [[ lnd_monthly_glb ]]
  bundle = "bundle_glb"
  frequency = "monthly"
  input_files = "elm.h0"
  input_subdir = "archive/lnd/hist"
  mapping_file = "glb"
  vars = ""

  [[ land_monthly ]]
  extra_vars = "landfrac"
  frequency = "monthly"
  input_files = "elm.h0"
  input_subdir = "archive/lnd/hist"
  mapping_file = "map_r05_to_cmip6_180x360_aave.20231110.nc"
  vars = "FSH,RH2M,LAISHA,LAISUN,QINTR,QOVER,QRUNOFF,QSOIL,QVEGE,QVEGT,SOILICE,SOILLIQ,SOILWATER_10CM,TSA,TSOI,H2OSNO,TOTLITC,CWDC,SOIL1C,SOIL2C,SOIL3C,SOIL4C,WOOD_HARVESTC,TOTVEGC,NBP,GPP,AR,HR"

  [[ land_monthly_energy ]]
  frequency = "monthly"
  input_files = "elm.h0"
  input_subdir = "archive/lnd/hist"
  mapping_file = ""
  vars = "EFLX_LH_TOT,FIRA,FLDS,FSA,FSDS,FSRND,FSRVD,FSDSND,FSDSVD,FSH,TSA"

[e3sm_to_cmip]
active = True
frequency = "monthly"
ts_num_years = 2
walltime = "00:30:00"

  [[ atm_monthly_180x360_aave ]]
  cmip_vars = "ua, va, ta, tas, ts, psl, ps, pr"
  input_files = "eam.h0"
  ts_subsection = "atm_monthly_180x360_aave"

  [[ atm_monthly_eamxx_180x360_aave ]]
  cmip_vars = "ua, va, ta, tas, psl, ps"
  input_component = "eamxx"
  input_files = "AVERAGE.nmonths_x1"
  interp_vars = "U,V,T_mid"
  ts_subsection = "atm_monthly_eamxx_180x360_aave"

  [[ land_monthly ]]
  input_files = "elm.h0"
  ts_subsection = "land_monthly"

[tc_analysis]
active = True
input_grid = "ne30pg2"
walltime = "00:30:00"

[e3sm_diags]
active = True
climo_diurnal_frequency = "diurnal_8xdaily"
climo_diurnal_subsection = "atm_monthly_diurnal_8xdaily_180x360_aave"
climo_subsection = "atm_monthly_180x360_aave"
grid = '180x360_aave'
multiprocessing = True
num_workers = 8
ref_final_yr = 1986
ref_start_yr = 1985
ref_years = "1985-1986",
short_name = "v3.LR.historical_0051"
ts_daily_subsection = "atm_daily_180x360_aave"
ts_num_years = 2
ts_subsection = "atm_monthly_180x360_aave"
walltime = "02:00:00"

  [[ atm_monthly_180x360_aave ]]
  sets = "lat_lon","zonal_mean_xy","zonal_mean_2d","polar","cosp_histogram","meridional_mean_2d","annual_cycle_zonal_mean","zonal_mean_2d_stratosphere","enso_diags","qbo","area_mean_time_series","diurnal_cycle","streamflow","mp_partition","tropical_subseasonal","precip_pdf","tc_analysis","aerosol_aeronet",

  [[ atm_monthly_180x360_aave_mvm ]]
  # Model-vs-model using the same simulation as the reference
  diff_title = "Difference"
  ref_name = "v3.LR.historical_0051"
  reference_data_path = "/zppy_snapshot/output/post/atm/180x360_aave/clim"
  run_type = "model_vs_model"
  sets = "lat_lon","zonal_mean_xy","enso_diags","qbo","diurnal_cycle","streamflow","tropical_subseasonal","tc_analysis",
  short_ref_name = "same simulation"
  swap_test_ref = False
  tag = "model_vs_model"
  ts_num_years_ref = 2

  [[ lnd_monthly_mvm_lnd ]]
  # Model-vs-model using the same simulation as the reference
  climo_subsection = "land_monthly_climo"
  diff_title = "Difference"
  ref_name = "v3.LR.historical_0051"
  reference_data_path = "/zppy_snapshot/output/post/lnd/180x360_aave/clim"
  run_type = "model_vs_model"
  sets = "lat_lon_land",
  short_ref_name = "same simulation"
  swap_test_ref = True
  tag = "model_vs_model"
  ts_num_years_ref = 2

[mpas_analysis]
active = True
anomalyRefYear = 1985
mesh = "IcoswISC30E3r5"
parallelTaskCount = 6
shortTermArchive = True
walltime = "00:30:00"

  [[ reference ]]
  ts_years = "1985-1986",
  climo_years = "1985-1986",
  enso_years = "1985-1986",

  [[ test ]]
  ts_years = "1985-1988",
  climo_years = "1987-1988",
  enso_years = "1987-1988",

  [[ mvm ]]
  reference_data_path = [[ reference ]]
  test_data_path = [[ test ]]

[global_time_series]
active = True
climo_years = "1985-1986", "1987-1988",
experiment_name = "v3.LR.historical_0051"
figstr = "v3.LR.historical_0051"
mpas_analysis_subsections = "reference", "test",
ts_num_years = 2
ts_years = "1985-1986", "1985-1988",
walltime = "00:30:00"
years = "1985-1988",

  [[ viewer_both ]]
  make_viewer = True
  moc_file = "mocTimeSeries_1985-1988.nc"
  plots_atm = "TREFHT"
  plots_lnd = "FSH,RH2M,LAISHA,LAISUN"

  [[ classic_pdf_original ]]
  moc_file = "mocTimeSeries_1985-1988.nc"

  [[ classic_original_8_no_ocn ]]
  plots_original = "net_toa_flux_restom,global_surface_air_temperature,toa_radiation,net_atm_energy_imbalance,net_atm_water_imbalance"

[ilamb]
active = True
e3sm_to_cmip_atm_subsection = "atm_monthly_180x360_aave"
e3sm_to_cmip_land_subsection = "land_monthly"
nodes = 8
short_name = "v3.LR.historical_0051"
