[pcmdi_diags]
active = True
e3sm_to_cmip_atm_subsection = "atm_monthly_180x360_aave"
model_name = 'e3sm.historical.v3-LR.0051'
model_tableID = 'Amon'
multiprocessing = True
num_workers = 24
pcmdi_debug = False
ref_final_yr = 1988
ref_start_yr = 1985
ts_num_years = 2
ts_years = "1985-1986", "1987-1988",
walltime = "2:00:00"

  [[ mean_climate ]]
  current_set = "mean_climate"
  clim_obs_sets = "default"
  cmip_vars = "pr,psl,rlut,rsut,tas,ts,ta,ua,va,zg"
  clim_vars = "pr,psl,rlut,rsut,tas,ts,ta-200,ta-850,ua-200,ua-850,va-200,va-850"
  clim_regions = "global"
  target_grid = "2.5x2.5"
  target_grid_string = "2p5x2p5"

  [[ variability_modes_cpl ]]
