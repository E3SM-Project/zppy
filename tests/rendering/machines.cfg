# Configuration rendered by tests/test_rendered_scripts.py for each machine
# other than Chrysalis (which tests/rendering/comprehensive.cfg covers).
#
# This creates one job per task, enough to exercise the machine-specific
# branches of the templates (SLURM headers, parallel launchers, web-server
# permissions, and so on) without duplicating the comprehensive configuration.
#
# The test replaces `output` with a temporary directory and then writes that
# directory as /zppy_snapshot in the snapshots.

[default]
case = "v3.LR.historical_0051"
dry_run = True
input = "/zppy_snapshot/input/v3.LR.historical_0051"
input_subdir = archive/atm/hist
mapping_file = "map_ne30pg2_to_cmip6_180x360_aave.20200201.nc"
output = "/zppy_snapshot/output"
www = "/zppy_snapshot/www"
years = "1985-1986",

[climo]
active = True
walltime = "00:30:00"

  [[ atm_monthly_180x360_aave ]]
  input_files = "eam.h0"
  vars = ""

  [[ atm_monthly_diurnal_8xdaily_180x360_aave ]]
  frequency = "diurnal_8xdaily"
  input_files = "eam.h3"
  vars = "PRECT"

  [[ land_monthly_climo_native ]]
  input_files = "elm.h0"
  input_subdir = "archive/lnd/hist"
  mapping_file = ""
  vars = ""

[ts]
active = True
walltime = "00:30:00"

  [[ atm_monthly_180x360_aave ]]
  frequency = "monthly"
  input_files = "eam.h0"
  vrt_remap_vars = "T"

  [[ atm_monthly_glb ]]
  frequency = "monthly"
  input_files = "eam.h0"
  mapping_file = "glb"

  [[ land_monthly ]]
  frequency = "monthly"
  input_files = "elm.h0"
  input_subdir = "archive/lnd/hist"
  mapping_file = "map_r05_to_cmip6_180x360_aave.20231110.nc"
  vars = "FSH,TSA"

[e3sm_to_cmip]
active = True
ts_num_years = 2
walltime = "00:30:00"

  [[ atm_monthly_180x360_aave ]]
  cmip_vars = "ua, ta, tas"
  input_files = "eam.h0"
  ts_subsection = "atm_monthly_180x360_aave"

  [[ land_monthly ]]
  input_files = "elm.h0"
  ts_subsection = "land_monthly"

[tc_analysis]
active = True
input_grid = "ne30pg2"
walltime = "00:30:00"

[e3sm_diags]
active = True
climo_subsection = "atm_monthly_180x360_aave"
grid = '180x360_aave'
short_name = "v3.LR.historical_0051"
walltime = "02:00:00"

  [[ atm_monthly_180x360_aave ]]
  sets = "lat_lon",

[mpas_analysis]
active = True
climo_years = "1985-1986",
enso_years = "1985-1986",
mesh = "IcoswISC30E3r5"
ts_years = "1985-1986",
walltime = "00:30:00"

[global_time_series]
active = True
climo_years = "1985-1986",
experiment_name = "v3.LR.historical_0051"
figstr = "v3.LR.historical_0051"
moc_file = "mocTimeSeries_1985-1986.nc"
ts_num_years = 2
ts_years = "1985-1986",
walltime = "00:30:00"
years = "1985-1986",

[ilamb]
active = True
land_only = True
short_name = "v3.LR.historical_0051"
ts_land_subsection = "land_monthly"
e3sm_to_cmip_land_subsection = "land_monthly"
ts_num_years = 2
walltime = "2:00:00"

[livvkit]
active = True
climo_subsections = "land_monthly_climo_native",
sets = "energy_era5"
walltime = "1:30:00"

[pcmdi_diags]
active = True
e3sm_to_cmip_atm_subsection = "atm_monthly_180x360_aave"
model_name = 'e3sm.historical.v3-LR.0051'
model_tableID = 'Amon'
ref_final_yr = 1986
ref_start_yr = 1985
ts_num_years = 2
ts_years = "1985-1986",
walltime = "2:00:00"

  [[ mean_climate ]]
  clim_obs_sets = "default"
  cmip_vars = "pr,tas"
  clim_vars = "pr,tas"
  current_set = "mean_climate"
