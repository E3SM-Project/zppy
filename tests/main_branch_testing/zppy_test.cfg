# zppy integration test configuration
# Source: run_integration_test.bash --config path/to/this.cfg
#
# Sections are comments only -- bash sources this file as KEY=VALUE pairs.

# ----------------------------------------------------------------------------
# Runtime (formerly "Parse arguments")
# ----------------------------------------------------------------------------

MACHINE=chrysalis       # chrysalis | compy | perlmutter
START_PHASE=1           # 1 | 2 | 3
AUTO_MODE=true          # true = skip all interactive checkpoints
EXPLICIT_TAG=""         # Leave empty to auto-generate; set to resume a prior run

# ----------------------------------------------------------------------------
# Per-run settings
# ----------------------------------------------------------------------------

RUN_NUMBER=1

DIAGS_BASE_BRANCH="main"
E3SM_TO_CMIP_BASE_BRANCH="master"
MPAS_BASE_BRANCH="develop"
ZI_BASE_BRANCH="main"
ZPPY_BASE_BRANCH="main"

# "dev"     = build a dedicated conda env from the repo's dev.yml
# "unified" = use the machine's e3sm-unified env (UNIFIED_ENV_CMD)
DIAGS_ENV_TYPE="dev"
E3SM_TO_CMIP_ENV_TYPE="dev"
MPAS_ENV_TYPE="dev"
ZI_ENV_TYPE="dev"

# Optional: reuse an existing named conda env instead of creating a new one.
# When non-empty AND the corresponding ENV_TYPE is "dev", the script skips
# conda env creation and activates this env directly.
# Leave empty to let the script auto-name and create the env as usual.
DIAGS_EXISTING_ENV=""
E3SM_TO_CMIP_EXISTING_ENV=""
MPAS_EXISTING_ENV=""
ZI_EXISTING_ENV=""
ZPPY_EXISTING_ENV=""

# Comma-separated list of zppy cfg names to generate and submit.
# These correspond to generated filenames: test_weekly_<name>_<machine>.cfg
# Any name containing "bundle" is treated as a bundle cfg and re-submitted in Phase 2.
CFGS_TO_RUN="weekly_bundles,weekly_comprehensive_v2,weekly_comprehensive_v3,weekly_legacy_3.1.0_bundles,weekly_legacy_3.1.0_comprehensive_v2,weekly_legacy_3.1.0_comprehensive_v3,weekly_legacy_3.0.0_bundles,weekly_legacy_3.0.0_comprehensive_v2,weekly_legacy_3.0.0_comprehensive_v3"

# Comma-separated list of tasks to enable in utils.py.
TASKS_TO_RUN="e3sm_diags,mpas_analysis,global_time_series,ilamb,livvkit,pcmdi_diags"

# ----------------------------------------------------------------------------
# Frozen dependency base (isolates image-diff root causes)
# ----------------------------------------------------------------------------
#
# Problem this solves: test_images.py can show diffs for e3sm_diags or
# pcmdi_diags plots that are actually caused by an unrelated dependency
# (e.g. matplotlib moving a plot a pixel to the right) rather than by the
# package under test. Freezing a component's dependencies isolates root
# causes and skips redundant env solves/builds.
#
# How it works: each component listed in FROZEN_BASE_COMPONENTS gets its OWN
# dedicated, fully-resolved conda env, built once per run from that
# component's BASE_ENV_LOCK_FILE_<COMPONENT>. Test envs for that component
# are then created by CLONING its frozen base (fast, no solve) and
# `pip install`ing the branch under test on top -- so every dependency other
# than that component's own code stays pinned to exactly what's in its lock
# file. Each component's frozen base is independent: e3sm_diags's cdat-based
# stack, mpas_analysis's ESMF/MPAS libs, and e3sm_to_cmip's cmor never need to
# be resolved into a single shared environment together.
#
# Caveat: if a component's branch genuinely needs a new or newer dependency,
# `pip install .` will pull it in on top of its frozen base -- the script
# logs a diff when that happens (see pre_install_*/post_install_* files in
# the run directory) so it's a visible, deliberate exception rather than
# silent drift. When that happens, regenerate that component's lock file to
# bake the new dependency in for future runs.

# Master switch. When false, every component below falls back to its
# original behavior (solve its own dev.yml), regardless of the other
# settings in this section.
FREEZE_DEPENDENCIES=true

# Which components get their own dedicated frozen base instead of solving
# their dev.yml fresh each run. Comma-separated subset of:
#   e3sm_to_cmip,e3sm_diags,mpas_analysis,zppy_interfaces,zppy
# Defaults to every component this script builds a dev env for -- image
# diffs can come from any plotting-adjacent tool (e3sm_diags, pcmdi_diags via
# zppy_interfaces, mpas_analysis), not just the ones flagged in the original
# bug report, so there's no reason to leave any of them unfrozen by default.
FROZEN_BASE_COMPONENTS="e3sm_to_cmip,e3sm_diags,mpas_analysis,zppy_interfaces,zppy"

# ----------------------------------------------------------------------------
# One-time setup
# ----------------------------------------------------------------------------

HOME_DIR="$HOME"
EZ_DIR="$HOME_DIR/ez"

E3SM_DIAGS_DIR="$EZ_DIR/e3sm_diags"
E3SM_TO_CMIP_DIR="$EZ_DIR/e3sm_to_cmip"
MPAS_ANALYSIS_DIR="$EZ_DIR/MPAS-Analysis"
ZPPY_INTERFACES_DIR="$EZ_DIR/zppy-interfaces"
ZPPY_DIR="$EZ_DIR/zppy"

CONDA_PROFILE="$HOME_DIR/miniforge3/etc/profile.d/conda.sh"
TAG_CACHE_FILE="$HOME_DIR/.zppy_test_tag"

# One FULLY RESOLVED environment spec per frozen component -- required for
# each name listed in FROZEN_BASE_COMPONENTS above. Must be exact-version
# output, e.g.:
#   conda env create -f <component's dev.yml> -n tmp-lock-gen
#   conda activate tmp-lock-gen
#   conda list --explicit > /home/$USER/ez/frozen-base-<component>.txt
# A dev.yml is NOT sufficient here -- it re-solves and can drift between
# runs even unmodified. Regenerate a component's file whenever that
# component needs a new/updated dependency baked into its frozen base.
BASE_ENV_LOCK_FILE_E3SM_TO_CMIP="$EZ_DIR/frozen-base-e3sm_to_cmip.txt"
BASE_ENV_LOCK_FILE_E3SM_DIAGS="$EZ_DIR/frozen-base-e3sm_diags.txt"
BASE_ENV_LOCK_FILE_MPAS_ANALYSIS="$EZ_DIR/frozen-base-mpas_analysis.txt"
BASE_ENV_LOCK_FILE_ZPPY_INTERFACES="$EZ_DIR/frozen-base-zppy_interfaces.txt"
BASE_ENV_LOCK_FILE_ZPPY="$EZ_DIR/frozen-base-zppy.txt"
