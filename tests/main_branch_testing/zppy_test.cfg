# zppy integration test configuration
# Source: run_integration_test.bash --config path/to/this.cfg
#
# Sections are comments only -- bash sources this file as KEY=VALUE pairs.

# ----------------------------------------------------------------------------
# Runtime (formerly "Parse arguments")
# ----------------------------------------------------------------------------

MACHINE=chrysalis       # chrysalis | compy | perlmutter
START_PHASE=1           # 1 | 2 | 3
AUTO_MODE=true          # true = skip all interactive checkpoints
EXPLICIT_TAG=""         # Leave empty to auto-generate; set to resume a prior run

# ----------------------------------------------------------------------------
# Per-run settings
# ----------------------------------------------------------------------------

RUN_NUMBER=1

DIAGS_BASE_BRANCH="main"
E3SM_TO_CMIP_BASE_BRANCH="master"
MPAS_BASE_BRANCH="develop"
ZI_BASE_BRANCH="main"
ZPPY_BASE_BRANCH="main"

# Optional: the branch the *expected* (baseline) results were actually
# generated from. Defaults to the matching *_BASE_BRANCH above, which is
# correct whenever you're testing straight off that default branch. Set
# this explicitly when *_BASE_BRANCH above points at a variant/feature
# branch but the expected results it's being compared against are still
# based on a different branch (commonly the project's default branch).
# Example: testing a feature branch rebased onto main, whose expected
# results were generated from main -- set ZPPY_BASE_BRANCH to the feature
# branch and ZPPY_EXPECTED_RESULTS_BRANCH="main".
DIAGS_EXPECTED_RESULTS_BRANCH=""
E3SM_TO_CMIP_EXPECTED_RESULTS_BRANCH=""
MPAS_EXPECTED_RESULTS_BRANCH=""
ZI_EXPECTED_RESULTS_BRANCH=""
ZPPY_EXPECTED_RESULTS_BRANCH="main"

# "dev"     = build a dedicated conda env from the repo's dev.yml
# "unified" = use the machine's e3sm-unified env (UNIFIED_ENV_CMD)
DIAGS_ENV_TYPE="dev"
E3SM_TO_CMIP_ENV_TYPE="dev"
MPAS_ENV_TYPE="dev"
ZI_ENV_TYPE="dev"

# Optional: reuse an existing named conda env instead of creating a new one.
# When non-empty AND the corresponding ENV_TYPE is "dev", the script skips
# conda env creation and activates this env directly.
# Leave empty to let the script auto-name and create the env as usual.
DIAGS_EXISTING_ENV=""
E3SM_TO_CMIP_EXISTING_ENV=""
MPAS_EXISTING_ENV=""
ZI_EXISTING_ENV=""
ZPPY_EXISTING_ENV=""

# Optional: path to an NCO installation, passed through to utils.py's
# TEST_SPECIFICS["nco_path"]. Leave empty for the common case where NCO is
# already on PATH via the active environment.
NCO_PATH=""

# Comma-separated list of zppy cfg names to generate and submit.
# These correspond to generated filenames: test_weekly_<name>_<machine>.cfg
# Any name containing "bundle" is treated as a bundle cfg: it's re-submitted
# in Phase 2, and its presence here is also what determines whether Phase 3
# runs test_bundles.py at all (skipped if no bundle cfg is included).
CFGS_TO_RUN="weekly_bundles,weekly_comprehensive_v2,weekly_comprehensive_v3,weekly_legacy_3.1.0_bundles,weekly_legacy_3.1.0_comprehensive_v2,weekly_legacy_3.1.0_comprehensive_v3,weekly_legacy_3.0.0_bundles,weekly_legacy_3.0.0_comprehensive_v2,weekly_legacy_3.0.0_comprehensive_v3"

# Comma-separated list of tasks to enable in utils.py.
TASKS_TO_RUN="e3sm_diags,mpas_analysis,global_time_series,ilamb,livvkit,pcmdi_diags"

# ----------------------------------------------------------------------------
# Markdown report automation (optional)
# ----------------------------------------------------------------------------

# Machine-specific expected-results directory (see automated_test.rst Step 1).
# When set, the generated report's "Step 1" section shows, per cfg/task,
# when its expected-results files were last promoted (copied into place).
EXPECTED_RESULTS_DIR=""

# Optional: the date each dependency's expected results were actually
# PRODUCED (not promoted -- those can differ, e.g. when older results are
# recopied into place without a fresh run; see the discussion this cfg
# option grew out of). Normally left empty: the script auto-detects each
# one from the "Generated:" line of the promoted env_description.txt
# (earliest found across every cfg in CFGS_TO_RUN), which is exactly the
# case such a promotion needs. Set one explicitly only when you know
# better than that auto-detection -- e.g. you've confirmed via a
# discussion thread that the promoted results actually came from an
# earlier run than their env_description.txt/promotion date suggests.
# When known (auto-detected or set), the "Step 2" section of the report
# lists commits/PRs merged on that dependency's expected-results baseline
# branch (see *_EXPECTED_RESULTS_BRANCH above) since this date.
#
# zppy-interfaces bundles two independently-refreshed tasks, so it gets two
# dates instead of one: ZI_GLOBAL_TIME_SERIES_EXPECTED_RESULTS_DATE and
# ZI_PCMDI_DIAGS_EXPECTED_RESULTS_DATE.
#
# e3sm_to_cmip and zppy produce no task subdir of their own, so there's no
# "expected results" file to read a production date from -- these use
# *_LAST_TESTED_DATE instead, meaning "has anything changed since we last
# tested this dependency at all", not "when were results produced".
DIAGS_EXPECTED_RESULTS_DATE=""
MPAS_EXPECTED_RESULTS_DATE=""
ZI_GLOBAL_TIME_SERIES_EXPECTED_RESULTS_DATE=""
ZI_PCMDI_DIAGS_EXPECTED_RESULTS_DATE=""
E3SM_TO_CMIP_LAST_TESTED_DATE=""
ZPPY_LAST_TESTED_DATE=""

# ----------------------------------------------------------------------------
# One-time setup
# ----------------------------------------------------------------------------

HOME_DIR="$HOME"
EZ_DIR="$HOME_DIR/ez"

E3SM_DIAGS_DIR="$EZ_DIR/e3sm_diags"
E3SM_TO_CMIP_DIR="$EZ_DIR/e3sm_to_cmip"
MPAS_ANALYSIS_DIR="$EZ_DIR/MPAS-Analysis"
ZPPY_INTERFACES_DIR="$EZ_DIR/zppy-interfaces"
ZPPY_DIR="$EZ_DIR/zppy"

CONDA_PROFILE="$HOME_DIR/miniforge3/etc/profile.d/conda.sh"
TAG_CACHE_FILE="$HOME_DIR/.zppy_test_tag"
