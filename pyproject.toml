# This config file is required for Black.
# Unforunately, black does not support setup.cfg (refer to link).
# https://github.com/psf/black/issues/683#issuecomment-490236406

[build-system]
requires = [
  "setuptools>=64",
]
build-backend = "setuptools.build_meta"

[project]
name = "zppy"
version = "3.2.0"
description = "Post-processing software for E3SM"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [
  { name = "Ryan Forsyth", email = "forsyth2@llnl.gov" },
  { name = "Chris Golaz", email = "golaz1@llnl.gov" },
]
keywords = ["E3SM", "post-processing", "climate", "analysis"]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/E3SM-Project/zppy"
Issues = "https://github.com/E3SM-Project/zppy/issues"
Repository = "https://github.com/E3SM-Project/zppy.git"

[project.scripts]
zppy = "zppy.__main__:main"

# make sure these always match pinned versions in conda/dev.yml and .pre-commit-config.yaml
# (run `python scripts/sync_pre_commit_versions.py` to sync them)
[project.optional-dependencies]
qa = [
  "black==26.5.1",
  "flake8==7.3.0",
  "flake8-isort==6.1.2",
  "isort==8.0.1",
  "mypy==2.3.0",
  "pre-commit==4.3.0",
  "pyyaml",
  "types-PyYAML>=6.0.0",
]

dev = [
  "tbump==6.9.0",
  "ipykernel",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["zppy", "zppy.*"]

[tool.setuptools.package-data]
zppy = [
  "**/*.bash",
  "**/*.csh",
  "**/*.cfg",
  "**/*.ini",
  "**/*.sh",
  "**/*.json",
  "**/*.jinja",
]

# `pre-commit-update` rewrites .pre-commit-config.yaml with ruamel.yaml.  Without
# this, it defaults to `indent(sequence=4)`, which puts the `-` of each list item
# in column 0 and reformats the whole file.  These settings keep its output in
# the conventional `  - item` style, so an update is a diff of just the revs.
[tool.pre-commit-update.yaml]
mapping = 2
sequence = 4
offset = 2

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
      \.eggs
    | \.git
    | \.mypy_cache
    | _build
    | conda
    | docs
 )/
'''

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.pycodestyle]
max-line-length = 119
exclude = [
  ".tox",
  ".git",
  "*/migrations/*",
  "*/static/CACHE/*",
  "docs",
  "node_modules",
  ".idea",
  ".mypy_cache",
  ".pytest_cache",
  "*__init__.py",
  "venv",
]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
