# This is an example zppy v3.1.0 configuration file for pm-cpu.
#
[default]
# Change these two paths to include your username instead
# You can also change these to match your preferred directory structure
output = /pscratch/sd/m/mek/zppy/20260930.ERA5r025_r05_IcoswISC30E3r5.pm-cpu.20TR
www = /global/cfs/cdirs/e3sm/www/mek/zppy_out
# Other paths
input = /pscratch/sd/s/sprice/e3sm_scratch/pm-cpu/20260930.ERA5r025_r05_IcoswISC30E3r5.pm-cpu.20TR

# zppy auto-determines and sources latest e3sm-unified on each supported machine with environment_commands commented out.
# For testing Unified rc:
environment_commands = "source /global/common/software/e3sm/anaconda_envs/load_latest_e3sm_unified_pm-cpu.sh"

# Other parameters:
campaign = "water_cycle"
case = 20260930.ERA5r025_r05_IcoswISC30E3r5.pm-cpu.20TR
account = e3sm
dry_run = True

[climo]
active = True
walltime = "0:30:00"
nodes = 1
years = "1980:2021:42"
qos=regular

  [[ land_monthly_climo ]]
  climo_jobs = 12
  frequency = "monthly"
  input_files = "elm.h0"
  input_subdir = run
  mapping_file = /global/cfs/cdirs/e3sm/zender/maps/map_r05_to_cmip6_180x360_traave.20240901.nc
  vars = "" # Setting this as "" will tell zppy to use ALL variables

  [[ land_monthly_climo_native ]]
  climo_jobs = 12
  frequency = "monthly"
  input_files = "elm.h0"
  input_subdir = run
  vars = ""

  [[ rof_monthly_climo_native ]]
  climo_jobs = 12
  frequency = "monthly"
  input_files = "mosart.h0"
  input_subdir = run
  vars = ""

  [[ land_monthly_climo_racmo_gis ]]
  climo_jobs = 12
  frequency = "monthly"
  climo_subsection = "racmo_gis"
  grid = "racmo_gis"
  input_files = "elm.h0"
  input_subdir = run
  mapping_file = /global/cfs/cdirs/e3sm/zender/maps/map_r05_to_racmo_gis_566x438_traave.20240801.nc
  vars = ""

  [[ land_monthly_climo_racmo_ais ]]
  climo_jobs = 12
  frequency = "monthly"
  input_files = "elm.h0"
  climo_subsection = "racmo_ais"
  grid = "racmo_ais"
  input_subdir = run
  mapping_file = /global/cfs/cdirs/e3sm/livvkit/maps/map_r05_to_racmo_ais_591x726.nc
  vars = ""

  [[ land_monthly_climo_merra2 ]]
  climo_jobs = 12
  frequency = "monthly"
  input_files = "elm.h0"
  climo_subsection = "merra2"
  grid = "merra2"
  input_subdir = run
  mapping_file = /global/cfs/cdirs/e3sm/livvkit/maps/map_r05_to_merra2_traave.20250124.nc
  vars = ""

  [[ land_monthly_climo_era5 ]]
  climo_jobs = 12
  frequency = "monthly"
  input_files = "elm.h0"
  climo_subsection = "era5"
  grid = "era5"
  input_subdir = run
  mapping_file = /global/cfs/cdirs/e3sm/livvkit/maps/map_r05_to_era5_s2n_721x1440.traave.20240124.nc
  vars = ""

[ts]
active = True
qos=debug
walltime = "00:30:00"
years = "1980:2021:42"

  [[ land_monthly ]]
  frequency = "monthly"
  input_files = "elm.h0"
  input_subdir = "run"
  # Variables:
  vars = "QICE,QICE_MELT,QRUNOFF,QSNOFRZ,QSNOMELT,QSOIL,QH2OSFC,RAIN,SNOW,SNOWICE,SNOWLIQ,H2OSNO,FSNO,EFLX_LH_TOT,FIRA,FLDS,FSA,FSDS,FSRND,FSRVD,FSDSND,FSDSVD,FSH,TSA"

  [[ rof_monthly ]]
  frequency = "monthly"
  input_files = "mosart.h0"
  input_subdir = run
  # Variables:
  vars = "TOTAL_DISCHARGE_TO_OCEAN_ICE,TOTAL_DISCHARGE_TO_OCEAN_LIQ,MASK"

[livvkit]
active = True
nodes = 1
walltime = "0:60:00"
icesheets = "gis,ais"
sets = "cmb,smb,snow,river,energy_racmo,energy_era5,energy_merra2,energy_ceres"
cfg = "inclusions/livvkit/livvkit_r05.jinja"
years = "1980:2021:42"
